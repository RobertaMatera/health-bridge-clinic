spring.application.name=backend

# Configurazione Database H2
spring.datasource.url=jdbc:h2:./projectworkmrdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=passwordTest
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
# DTOs are mapped inside transactional services; no lazy loading during serialization.
spring.jpa.open-in-view=false

# OpenAPI docs and Swagger UI are part of the project (enabled explicitly)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
