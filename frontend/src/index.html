<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Health Bridge Clinic</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B4F5C">
  <meta name="description" content="Health Bridge Clinic: medical reports shared between doctors and patients.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
  <!-- Shown until Angular boots; Angular replaces everything inside <app-root>. -->
  <app-root>
    <div class="boot-splash" role="status">
      <svg class="size-14" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="13" class="fill-brand"/>
        <path d="M10 36c0-9 6-14.5 14-14.5S38 27 38 36" class="stroke-white" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M24 8.5v7M19.5 12h9" class="stroke-mint" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <span class="boot-spinner" aria-hidden="true"></span>
      <span id="boot-label" class="sr-only">Loading…</span>
    </div>
  </app-root>
  <script>
    // Match the saved language before the app loads (same key as I18nService).
    try {
      if (localStorage.getItem('hbc.language') === 'it') {
        document.documentElement.lang = 'it';
        document.getElementById('boot-label').textContent = 'Caricamento…';
      }
    } catch (e) {}
  </script>
</body>
</html>
