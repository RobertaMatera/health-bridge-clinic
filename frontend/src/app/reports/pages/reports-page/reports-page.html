@if (authService.isDoctor()) {
  <app-doctor-reports/>
} @else {
  <ul class="flex flex-col gap-3">
    @for (report of reports(); track report.id) {
      <li>
        <a class="card flex items-center justify-between p-4" [routerLink]="['/reports', report.id]">
          #{{ report.id }}
          <app-report-status-badge [status]="report.status" audience="patient"/>
        </a>
      </li>
    }
  </ul>
}
