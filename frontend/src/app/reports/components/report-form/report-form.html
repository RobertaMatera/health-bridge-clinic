<form>
  <div class="form-control">
    @if (isEditing()) {
      <div class="form-control full-width">
        <textarea
          rows="5"
          [formControl]="outcomeFormControl"></textarea>
      </div>
    } @else {
      <label for="patient">Paziente</label>
      <select
        id="patient"
        [formControl]="patientFormControl">
        <option
          id="patient"
          [value]="null">Seleziona un paziente
        </option>
        @for (patient of patients(); track patient.id) {
          <option [ngValue]="patient">{{ `${patient.lastName} ${patient.firstName}` }} ({{ patient.email }})</option>
        }
      </select>
    }
  </div>

  @if (canEdit()) {
    <div
      class="flex justify-end gap-2 mt-5"
      [appHasRole]="UserRole.DOCTOR">
      @if (isEditing()) {
        <button
          class="button button-danger"
          [disabled]="form.invalid || report()?.exams?.length === 0"
          (click)="onFinalizeClick($event)">
          Finalizza
        </button>
        <button
          class="button"
          [disabled]="form.invalid"
          (click)="onSubmitClick($event)">
          Salva
        </button>
      } @else {
        <button
          class="button"
          [disabled]="form.invalid"
          (click)="onSubmitClick($event)">
          Crea
        </button>
      }
    </div>
  }
</form>
