<h2>Esami</h2>
<table class="mb-5">
  <thead>
  <th>Nome analisi</th>
  <th>Unità di misura</th>
  <th class="!text-end">Valore</th>
  <th></th>
  </thead>

  <tbody>
    @if ((report().exams ?? []).length === 0) {
      <tr>
        <td
          colspan="4"
          class="text-gray-500 py-5">Nessun esame presente
        </td>
      </tr>
    }

    @for (exam of report().exams; track exam.id) {
      <tr>
        <td>{{ exam.analysis }}</td>
        <td>{{ exam.unitOfMeasure }}</td>
        <td class="text-end">{{ exam.examValue }}</td>
        <td class="flex gap-1 justify-end">
          <button
            class="button-small"
            (click)="editingExam.set(exam)">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button
            class="button-small  button-danger"
            (click)="deleteExam(exam)">
            <i class="fa-solid fa-trash"></i>
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
<div class="flex justify-end mt-3">
  <button
    class="button"
    [disabled]="report().status === ReportStatus.FINALIZED"
    (click)="openCreateExamDialog()">Crea
  </button>
</div>

<h2>Esito</h2>
<app-report-form
  [report]="report()"
  (submit)="saveReport($event)"
  (finalize)="finalizeReport($event)"></app-report-form>

@if (editingExam(); as exam) {
  <app-exam-dialog
    [report]="report()"
    [exam]="exam"
    (dismiss)="editingExam.set(null)"
    (confirm)="onDialogConfirm()"></app-exam-dialog>
}
