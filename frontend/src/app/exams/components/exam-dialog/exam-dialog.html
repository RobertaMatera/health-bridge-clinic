<div class="dialog-backdrop">
  <div class="dialog-content">
    @if (exam(); as exam) {
      <div class="flex items-center justify-between mb-3">
        <h2>
          @if (exam.id) {
            Modifica esame
          } @else {
            Nuovo esame
          }
        </h2>
        <i
          class="fa-solid fa-lg fa-xmark cursor-pointer p-5"
          (click)="dismiss.emit()"></i>
      </div>

      @if (error(); as errorMessage) {
        <div class="error-message mb-3">
          {{ errorMessage }}
        </div>
      }

      <app-exam-form [exam]="exam" (submit)="onFormSubmit($event)"></app-exam-form>
    }
  </div>
</div>
