<form action="#">
  <div class="form-control full-width">
    <label for="analysis">
      Nome analisi
    </label>
    <input
      id="analysis"
      type="text"
      [formControl]="analysisFormControl">
  </div>

  <div class="form-control full-width">
    <label for="unitOfMeasure">
      Unità di misura
    </label>
    <input
      id="unitOfMeasure"
      type="text"
      [formControl]="unitOfMeasureFormControl">
  </div>

  <div class="form-control full-width">
    <label for="examValue">
      Valore
    </label>
    <input
      id="examValue"
      type="number"
      [formControl]="examValueFormControl">
  </div>
</form>

<div class="flex justify-end mt-5">
  <button
    class="button"
    [disabled]="form.invalid"
    (click)="onSubmitClick($event)">Salva
  </button>
</div>
